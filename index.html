<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voice Bot – MP4 Avatar</title>

  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    .stage{
      position: relative;
      width: min(720px, calc(100vw - 24px));
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }
    video{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>
  <div class="stage">
    <video
      id="avatarVideo"
      src="./SKO NiCY Animation Speech.mp4"
      muted
      playsinline
      preload="auto"
    ></video>
  </div>

  <!-- =========================================================
       HOOKS (must be BEFORE widget loads)
       ========================================================= -->

  <!-- RTCPeerConnection hook (lets us access the remote audio track) -->
  <script>
    (function () {
      window.__lipTap = { stream: null, pcSeen: 0, onStream: null };

      const OrigPC = window.RTCPeerConnection;
      if (!OrigPC) return;

      function WrappedPC(...args) {
        const pc = new OrigPC(...args);
        window.__lipTap.pcSeen++;

        pc.addEventListener("track", (ev) => {
          const track = ev.track;
          if (track && track.kind === "audio") {
            const stream = (ev.streams && ev.streams[0]) ? ev.streams[0] : new MediaStream([track]);
            window.__lipTap.stream = stream;
            if (typeof window.__lipTap.onStream === "function") window.__lipTap.onStream(stream);
          }
        });

        return pc;
      }
      WrappedPC.prototype = OrigPC.prototype;
      window.RTCPeerConnection = WrappedPC;
    })();
  </script>

  <!-- Cognigy WebRTC Widget -->
  <script src="https://static-trial.cognigy.ai/webrtc/webRTCWidget.js"></script>
  <script>
    addEventListener("load", () => {
      if (window.initWebRTCWidget) {
        window.initWebRTCWidget(
          "https://endpoint-trial-us.cognigy.ai/43947422bffcca503a42c2b9b03611a5f85c57045d9a05957c16111e450de980"
        );
      }
    });
  </script>

  <script>
    const video = document.getElementById("avatarVideo");

    /* ===================== CONFIG ===================== */

    // Freeze on a neutral frame while silent
    const IDLE_HOLD_TIME = 0.00;   // try 0.20 if frame 0 isn't neutral

    // Talk loop (full ~4s clip; avoid exact end)
    const TALK_START = 0.00;
    const TALK_END   = 3.98;
    const TALK_RATE  = 1.08;

    // Speech detection (your RMS logs looked healthy)
    const SMOOTHING   = 0.10;
    const SPEAK_ON    = 0.010;
    const SPEAK_OFF   = 0.006;
    const MIN_TALK_MS = 250;

    // 🔇 Ring suppression: mute ALL audio output for this long after call click
    const RING_MUTE_MS = 2000; // adjust freely

    /* ================================================== */

    let armed = false;
    let bound = false;

    // video state machine
    let mode = "idle"; // "idle" | "talk"
    let lastTalkStartMs = 0;

    // analyser state
    let audioCtx = null;
    let analyser = null;
    let data = null;
    let raf = null;

    function nowMs(){ return performance.now(); }

    function setModeIdle() {
      if (mode === "idle") return;
      mode = "idle";
      video.pause();
      try { video.currentTime = IDLE_HOLD_TIME; } catch {}
    }

    async function setModeTalk() {
      if (mode === "talk") return;
      mode = "talk";
      lastTalkStartMs = nowMs();

      video.loop = false;
      video.playbackRate = TALK_RATE;
      try { video.currentTime = TALK_START + 0.01; } catch {}

      try { await video.play(); } catch {}
    }

    // Freeze once metadata is ready (prevents autoplay-like behavior)
    video.addEventListener("loadedmetadata", () => {
      video.pause();
      try { video.currentTime = IDLE_HOLD_TIME; } catch {}
    });

    // Loop talk segment while talking
    video.addEventListener("timeupdate", () => {
      if (mode === "talk" && video.currentTime >= TALK_END) {
        video.currentTime = TALK_START + 0.01;
      }
    });

    function computeRMS(buf){
      let sum = 0;
      for (let i = 0; i < buf.length; i++){
        const x = (buf[i] - 128) / 128;
        sum += x * x;
      }
      return Math.sqrt(sum / buf.length);
    }

    function stopAnalyser(){
      if (raf) cancelAnimationFrame(raf);
      raf = null;
    }

    async function startAnalyserFromStream(stream){
      stopAnalyser();

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();

      const source = audioCtx.createMediaStreamSource(stream);

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      data = new Uint8Array(analyser.fftSize);

      // Keep graph alive (silent output)
      const zero = audioCtx.createGain();
      zero.gain.value = 0;

      source.connect(analyser);
      analyser.connect(zero);
      zero.connect(audioCtx.destination);

      let last = 0;

      const loop = async () => {
        analyser.getByteTimeDomainData(data);

        const rms = computeRMS(data);
        last = last * SMOOTHING + rms * (1 - SMOOTHING);

        // Normal talk/idle logic with debounce
        if (mode !== "talk" && last >= SPEAK_ON) {
          await setModeTalk();
        } else if (mode === "talk") {
          const elapsed = nowMs() - lastTalkStartMs;
          if (elapsed >= MIN_TALK_MS && last <= SPEAK_OFF) {
            setModeIdle();
          }
        }

        raf = requestAnimationFrame(loop);
      };
      loop();
    }

    function bindOnceFromStream(stream){
      if (bound) return;
      bound = true;
      startAnalyserFromStream(stream).catch(()=>{});
    }

    /* =========================================================
       GLOBAL AUDIO MUTE (RING KILL)
       =========================================================
       This is a demo-safe blunt tool: it mutes ALL audio output for
       RING_MUTE_MS immediately after clicking start call, then releases.
       ========================================================= */

    let globalMuteCtx = null;

    async function muteAllAudioFor(ms){
      try{
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;

        if (!globalMuteCtx) globalMuteCtx = new AC();

        // Ensure it's running then suspend to silence output
        await globalMuteCtx.resume();
        await globalMuteCtx.suspend();

        setTimeout(async () => {
          try { await globalMuteCtx.resume(); } catch {}
        }, ms);
      } catch {}
    }

    // Arm on first user gesture (clicking widget call button counts)
    window.addEventListener("pointerdown", () => {
      if (armed) return;
      armed = true;

      // 🔇 Kill the ring (adjust RING_MUTE_MS at top)
      muteAllAudioFor(RING_MUTE_MS);

      // Start in idle frame immediately
      mode = "idle";
      video.pause();
      try { video.currentTime = IDLE_HOLD_TIME; } catch {}

      // Bind to WebRTC stream when it arrives
      if (window.__lipTap) {
        window.__lipTap.onStream = (s) => bindOnceFromStream(s);
        if (window.__lipTap.stream) bindOnceFromStream(window.__lipTap.stream);
      }
    }, { capture: true });

    // Initial freeze
    video.pause();
    try { video.currentTime = IDLE_HOLD_TIME; } catch {}
  </script>
</body>
</html>

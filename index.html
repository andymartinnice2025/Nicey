<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voice Bot – MP4 Avatar (Animate on Bot Audio)</title>

  <style>
    html, body { height: 100%; margin: 0; background: #000; }

    .stage{
      position: relative;
      width: min(720px, calc(100vw - 24px));
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }

    video{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>
  <div class="stage">
    <video
      id="avatarVideo"
      src="./SKO NiCY Animation Speech.mp4"
      muted
      playsinline
      preload="auto"
    ></video>
  </div>

  <!-- =========================================================
       HOOKS (must be BEFORE widget loads)
       ========================================================= -->

  <!-- RTCPeerConnection hook -->
  <script>
    (function () {
      window.__lipTap = { stream: null, pcSeen: 0, onStream: null };

      const OrigPC = window.RTCPeerConnection;
      if (!OrigPC) return;

      function WrappedPC(...args) {
        const pc = new OrigPC(...args);
        window.__lipTap.pcSeen++;

        pc.addEventListener("track", (ev) => {
          const track = ev.track;
          if (track && track.kind === "audio") {
            const stream = (ev.streams && ev.streams[0]) ? ev.streams[0] : new MediaStream([track]);
            window.__lipTap.stream = stream;
            if (typeof window.__lipTap.onStream === "function") window.__lipTap.onStream(stream);
          }
        });

        return pc;
      }
      WrappedPC.prototype = OrigPC.prototype;
      window.RTCPeerConnection = WrappedPC;
    })();
  </script>

  <!-- Cognigy WebRTC Widget -->
  <script src="https://static-trial.cognigy.ai/webrtc/webRTCWidget.js"></script>
  <script>
    addEventListener("load", () => {
      if (window.initWebRTCWidget) {
        window.initWebRTCWidget(
          "https://endpoint-trial-us.cognigy.ai/43947422bffcca503a42c2b9b03611a5f85c57045d9a05957c16111e450de980"
        );
      }
    });
  </script>

  <script>
    const video = document.getElementById("avatarVideo");

    /* ===================== CONFIG ===================== */

    // Choose a neutral-looking frame here
    const IDLE_HOLD_TIME = 0.00;

    // Talk loop: use almost full clip, avoid exact end
    const TALK_START = 0.00;
    const TALK_END   = 3.98;
    const TALK_RATE  = 1.08;

    // ULTRA-sensitive defaults (we'll also auto-adapt)
    const SMOOTHING = 0.08;

    // Speaking thresholds (very low)
    let SPEAK_ON  = 0.010;   // start talking
    let SPEAK_OFF = 0.006;   // stop talking

    // For auto-adaptive noise floor (first ~2s)
    const CALIBRATION_MS = 2000;
    const ON_MULT  = 4.0;    // speak_on = noiseFloor * ON_MULT
    const OFF_MULT = 2.6;    // speak_off = noiseFloor * OFF_MULT

    // Debug logging
    const DEBUG = true; // set false once stable

    /* ================================================== */

    let armed = false;
    let bound = false;
    let speaking = false;

    let audioCtx = null;
    let analyser = null;
    let data = null;
    let raf = null;

    // Freeze the MP4 until speaking=true
    function holdIdleFrame() {
      video.pause();
      try { video.currentTime = IDLE_HOLD_TIME; } catch {}
    }

    video.addEventListener("loadedmetadata", holdIdleFrame);
    video.addEventListener("canplay", holdIdleFrame);
    video.addEventListener("play", () => { if (!speaking) holdIdleFrame(); });

    // Loop talk segment while speaking
    video.addEventListener("timeupdate", () => {
      if (speaking && video.currentTime >= TALK_END) {
        video.currentTime = TALK_START + 0.01;
      }
    });

    function computeRMS(buf){
      let sum = 0;
      for (let i = 0; i < buf.length; i++){
        const x = (buf[i] - 128) / 128;
        sum += x * x;
      }
      return Math.sqrt(sum / buf.length);
    }

    async function setSpeaking(on){
      if (on === speaking) return;
      speaking = on;

      if (speaking){
        video.loop = false;
        video.playbackRate = TALK_RATE;
        try { video.currentTime = TALK_START + 0.01; } catch {}
        try { await video.play(); } catch (e) {
          if (DEBUG) console.log("[mp4] video.play() blocked:", e);
        }
        if (DEBUG) console.log("[mp4] SPEAKING ON");
      } else {
        holdIdleFrame();
        if (DEBUG) console.log("[mp4] SPEAKING OFF");
      }
    }

    function stopAnalyser(){
      if (raf) cancelAnimationFrame(raf);
      raf = null;
    }

    async function startAnalyserFromStream(stream){
      stopAnalyser();

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();

      // Create source from captured stream
      const source = audioCtx.createMediaStreamSource(stream);

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      data = new Uint8Array(analyser.fftSize);

      // IMPORTANT: keep graph alive by connecting to a silent output
      const zero = audioCtx.createGain();
      zero.gain.value = 0;

      source.connect(analyser);
      analyser.connect(zero);
      zero.connect(audioCtx.destination);

      if (DEBUG) {
        const tracks = stream.getAudioTracks();
        console.log("[mp4] analyser started (tracks)", tracks.map(t => ({
          label: t.label,
          enabled: t.enabled,
          muted: t.muted,
          readyState: t.readyState
        })));
      }

      // Auto-calibrate noise floor (helps if RMS is tiny)
      const t0 = performance.now();
      let noiseFloor = 0.0005; // start small
      let last = 0;
      let logTick = 0;

      const loop = async () => {
        analyser.getByteTimeDomainData(data);

        const rms = computeRMS(data);

        // Update noise floor during calibration window (take low percentile-ish via slow min tracking)
        if (performance.now() - t0 < CALIBRATION_MS) {
          // smooth toward low values
          noiseFloor = Math.min(noiseFloor, rms) * 0.98 + rms * 0.02;
          // keep it from collapsing to 0
          noiseFloor = Math.max(noiseFloor, 0.0002);

          SPEAK_ON  = Math.max(0.002, noiseFloor * ON_MULT);
          SPEAK_OFF = Math.max(0.001, noiseFloor * OFF_MULT);
        }

        // Smooth the rms slightly
        last = last * SMOOTHING + rms * (1 - SMOOTHING);

        // Hysteresis
        if (!speaking && last >= SPEAK_ON) await setSpeaking(true);
        else if (speaking && last <= SPEAK_OFF) await setSpeaking(false);

        // Occasional debug
        if (DEBUG) {
          logTick++;
          if (logTick % 20 === 0) {
            console.log(
              "[mp4] rms:", rms.toFixed(5),
              "smoothed:", last.toFixed(5),
              "on:", SPEAK_ON.toFixed(5),
              "off:", SPEAK_OFF.toFixed(5)
            );
          }
        }

        raf = requestAnimationFrame(loop);
      };

      loop();
    }

    function bindOnceFromStream(stream){
      if (bound) return;
      bound = true;
      if (DEBUG) console.log("[mp4] bound from WebRTC track stream");
      startAnalyserFromStream(stream).catch(e => DEBUG && console.log("[mp4] analyser error:", e));
    }

    // Arm everything on first user gesture (clicking call button counts)
    window.addEventListener("pointerdown", () => {
      if (armed) return;
      armed = true;

      holdIdleFrame();

      // When a remote audio track arrives, bind immediately
      if (window.__lipTap) {
        window.__lipTap.onStream = (s) => bindOnceFromStream(s);

        // If already available
        if (window.__lipTap.stream) bindOnceFromStream(window.__lipTap.stream);
      }
    }, { capture: true });

    // Initial freeze
    holdIdleFrame();
  </script>
</body>
</html>

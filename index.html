<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voice Bot – MP4 Avatar (Talk Only On Bot Audio)</title>

  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    .stage{
      position: relative;
      width: min(720px, calc(100vw - 24px));
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }
    video{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>
  <div class="stage">
    <video
      id="avatarVideo"
      src="./SKO NiCY Animation Speech.mp4"
      muted
      playsinline
      preload="auto"
    ></video>
  </div>

  <!-- =========================================================
       HOOKS (must be BEFORE widget loads)
       ========================================================= -->

  <!-- 1) RTCPeerConnection hook (best signal for bot audio) -->
  <script>
    (function () {
      window.__lipTap = { stream: null, pcSeen: 0, onStream: null };

      const OrigPC = window.RTCPeerConnection;
      if (!OrigPC) return;

      function WrappedPC(...args) {
        const pc = new OrigPC(...args);
        window.__lipTap.pcSeen++;

        pc.addEventListener("track", (ev) => {
          const track = ev.track;
          if (track && track.kind === "audio") {
            const stream = (ev.streams && ev.streams[0]) ? ev.streams[0] : new MediaStream([track]);
            window.__lipTap.stream = stream;
            if (typeof window.__lipTap.onStream === "function") window.__lipTap.onStream(stream);
          }
        });
        return pc;
      }
      WrappedPC.prototype = OrigPC.prototype;
      window.RTCPeerConnection = WrappedPC;
    })();
  </script>

  <!-- 2) AudioContext hook (fallback) -->
  <script>
    (function () {
      const OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
      if (!OriginalAudioContext) return;

      window.__audioTap = { ctx: null, source: null, onSource: null };

      function WrappedAudioContext(...args) {
        const ctx = new OriginalAudioContext(...args);
        window.__audioTap.ctx = ctx;

        if (ctx.createMediaStreamSource) {
          const orig = ctx.createMediaStreamSource.bind(ctx);
          ctx.createMediaStreamSource = function (stream) {
            const src = orig(stream);
            window.__audioTap.source = src;
            if (typeof window.__audioTap.onSource === "function") window.__audioTap.onSource(ctx, src);
            return src;
          };
        }

        if (ctx.createMediaElementSource) {
          const origEl = ctx.createMediaElementSource.bind(ctx);
          ctx.createMediaElementSource = function (el) {
            const src = origEl(el);
            window.__audioTap.source = src;
            if (typeof window.__audioTap.onSource === "function") window.__audioTap.onSource(ctx, src);
            return src;
          };
        }

        return ctx;
      }
      WrappedAudioContext.prototype = OriginalAudioContext.prototype;
      window.AudioContext = WrappedAudioContext;
      if (window.webkitAudioContext) window.webkitAudioContext = WrappedAudioContext;
    })();
  </script>

  <!-- Cognigy WebRTC Widget -->
  <script src="https://static-trial.cognigy.ai/webrtc/webRTCWidget.js"></script>
  <script>
    addEventListener("load", () => {
      if (window.initWebRTCWidget) {
        window.initWebRTCWidget(
          "https://endpoint-trial-us.cognigy.ai/43947422bffcca503a42c2b9b03611a5f85c57045d9a05957c16111e450de980"
        );
      }
    });
  </script>

  <script>
    const video = document.getElementById("avatarVideo");

    /* ===================== CONFIG ===================== */

    // If frame 0 has mouth movement, set this to a neutral-looking timestamp like 0.20
    const IDLE_HOLD_TIME = 0.00;

    // Use almost whole clip as talk loop (avoid exact end)
    const TALK_START = 0.00;
    const TALK_END   = 3.98;
    const TALK_RATE  = 1.08;

    // Sensitivity (these are “safe” values; adjust if needed)
    const AUDIO_THRESHOLD = 0.012;
    const AUDIO_GAIN      = 16.0;
    const SMOOTHING       = 0.10;

    // Start/stop hysteresis
    const SPEAK_ON  = 0.035;
    const SPEAK_OFF = 0.020;

    /* ================================================== */

    let armed = false;
    let bound = false;     // <- IMPORTANT: only bind once
    let speaking = false;
    let last = 0;

    let audioCtx = null;
    let analyser = null;
    let data = null;
    let raf = null;

    function holdIdleFrame() {
      video.pause();
      try { video.currentTime = IDLE_HOLD_TIME; } catch {}
    }

    // Keep it frozen until bot audio says "speaking"
    video.addEventListener("loadedmetadata", holdIdleFrame);
    video.addEventListener("canplay", holdIdleFrame);
    video.addEventListener("play", () => { if (!speaking) holdIdleFrame(); });

    // Loop talk segment while speaking
    video.addEventListener("timeupdate", () => {
      if (speaking && video.currentTime >= TALK_END) {
        video.currentTime = TALK_START + 0.01;
      }
    });

    function computeRMS(buf){
      let sum = 0;
      for (let i = 0; i < buf.length; i++){
        const x = (buf[i] - 128) / 128;
        sum += x * x;
      }
      return Math.sqrt(sum / buf.length);
    }

    async function setSpeaking(on){
      if (on === speaking) return;
      speaking = on;

      if (speaking){
        video.loop = false;
        video.playbackRate = TALK_RATE;
        try { video.currentTime = TALK_START + 0.01; } catch {}
        try { await video.play(); } catch {}
      } else {
        holdIdleFrame();
      }
    }

    function stopAnalyser(){
      if (raf) cancelAnimationFrame(raf);
      raf = null;
      analyser = null;
      data = null;
    }

    async function startAnalyserFromSource(sourceNode){
      stopAnalyser();

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      data = new Uint8Array(analyser.fftSize);

      sourceNode.connect(analyser);

      console.log("[mp4] analyser started");

      const loop = async () => {
        analyser.getByteTimeDomainData(data);

        const rms = computeRMS(data);
        const raw = Math.max(0, (rms - AUDIO_THRESHOLD) * AUDIO_GAIN);
        const level = Math.min(1, raw);

        last = last * SMOOTHING + level * (1 - SMOOTHING);

        if (!speaking && last >= SPEAK_ON) await setSpeaking(true);
        else if (speaking && last <= SPEAK_OFF) await setSpeaking(false);

        raf = requestAnimationFrame(loop);
      };
      loop();
    }

    async function bindOnce(kind, makeSourceFn){
      if (bound) return;
      bound = true;

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();

      const sourceNode = makeSourceFn(audioCtx);

      console.log(`[mp4] bound from ${kind}`);

      await startAnalyserFromSource(sourceNode);
    }

    // Arm everything on first user interaction (clicking the widget call button counts)
    window.addEventListener("pointerdown", () => {
      if (armed) return;
      armed = true;

      holdIdleFrame();

      // Prefer WebRTC track binding (best) and ignore later binds
      if (window.__lipTap) {
        window.__lipTap.onStream = (stream) => {
          bindOnce("WebRTC track", (ctx) => ctx.createMediaStreamSource(stream)).catch(()=>{});
        };

        // In case the stream already exists by the time we arm
        if (window.__lipTap.stream) {
          const s = window.__lipTap.stream;
          bindOnce("WebRTC track", (ctx) => ctx.createMediaStreamSource(s)).catch(()=>{});
        }
      }

      // Fallback: AudioContext hook (only if WebRTC track never appears)
      if (window.__audioTap) {
        window.__audioTap.onSource = (ctx, src) => {
          // If already bound via WebRTC, ignore
          if (bound) return;
          // Use the existing ctx (don’t create a new one) — but still enforce one bind
          audioCtx = ctx;
          audioCtx.resume().catch(()=>{});
          console.log("[mp4] bound from AudioContext hook");
          startAnalyserFromSource(src).catch(()=>{});
          bound = true;
        };
      }
    }, { capture: true });

    // Initial freeze
    holdIdleFrame();
  </script>
</body>
</html>

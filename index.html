<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voice Bot – MP4 Avatar (Animate Only On Bot Audio)</title>

  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    .stage{
      position: relative;
      width: min(720px, calc(100vw - 24px));
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }
    video{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>
  <div class="stage">
    <video
      id="avatarVideo"
      src="./SKO NiCY Animation Speech.mp4"
      muted
      playsinline
      preload="auto"
    ></video>
  </div>

  <!-- =========================================================
       HOOKS (must be BEFORE widget loads)
       ========================================================= -->

  <!-- 1) RTCPeerConnection hook -->
  <script>
    (function () {
      window.__lipTap = { stream: null, pcSeen: 0, onStream: null };

      const OrigPC = window.RTCPeerConnection;
      if (!OrigPC) return;

      function WrappedPC(...args) {
        const pc = new OrigPC(...args);
        window.__lipTap.pcSeen++;

        pc.addEventListener("track", (ev) => {
          const track = ev.track;
          if (track && track.kind === "audio") {
            const stream = (ev.streams && ev.streams[0]) ? ev.streams[0] : new MediaStream([track]);
            window.__lipTap.stream = stream;
            if (typeof window.__lipTap.onStream === "function") window.__lipTap.onStream(stream);
          }
        });
        return pc;
      }
      WrappedPC.prototype = OrigPC.prototype;
      window.RTCPeerConnection = WrappedPC;
    })();
  </script>

  <!-- 2) AudioContext hook -->
  <script>
    (function () {
      const OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
      if (!OriginalAudioContext) return;

      window.__audioTap = { ctx: null, source: null, onSource: null };

      function WrappedAudioContext(...args) {
        const ctx = new OriginalAudioContext(...args);
        window.__audioTap.ctx = ctx;

        if (ctx.createMediaStreamSource) {
          const orig = ctx.createMediaStreamSource.bind(ctx);
          ctx.createMediaStreamSource = function (stream) {
            const src = orig(stream);
            window.__audioTap.source = src;
            if (typeof window.__audioTap.onSource === "function") window.__audioTap.onSource(ctx, src);
            return src;
          };
        }

        if (ctx.createMediaElementSource) {
          const origEl = ctx.createMediaElementSource.bind(ctx);
          ctx.createMediaElementSource = function (el) {
            const src = origEl(el);
            window.__audioTap.source = src;
            if (typeof window.__audioTap.onSource === "function") window.__audioTap.onSource(ctx, src);
            return src;
          };
        }

        return ctx;
      }
      WrappedAudioContext.prototype = OriginalAudioContext.prototype;
      window.AudioContext = WrappedAudioContext;
      if (window.webkitAudioContext) window.webkitAudioContext = WrappedAudioContext;
    })();
  </script>

  <!-- Cognigy WebRTC Widget -->
  <script src="https://static-trial.cognigy.ai/webrtc/webRTCWidget.js"></script>
  <script>
    addEventListener("load", () => {
      if (window.initWebRTCWidget) {
        window.initWebRTCWidget(
          "https://endpoint-trial-us.cognigy.ai/43947422bffcca503a42c2b9b03611a5f85c57045d9a05957c16111e450de980"
        );
      }
    });
  </script>

  <script>
    const video = document.getElementById("avatarVideo");

    /* =========================================================
       CONFIG
       ========================================================= */

    // Hold still here while silent (adjust if this frame has mouth movement)
    const IDLE_HOLD_TIME = 0.00;

    // Use full clip for talk loop (avoid exact end)
    const TALK_START = 0.00;
    const TALK_END   = 3.98;

    const TALK_RATE  = 1.08;

    // More sensitive defaults (since you reported no motion)
    const AUDIO_THRESHOLD = 0.012; // was 0.018
    const AUDIO_GAIN = 16.0;       // was 12

    const SMOOTHING = 0.08;        // faster response
    const SPEAK_ON  = 0.035;       // start earlier
    const SPEAK_OFF = 0.020;       // stop later (hysteresis)

    /* ========================================================= */

    let speaking = false;
    let last = 0;
    let raf = null;

    function holdIdleFrame() {
      video.pause();
      try { video.currentTime = IDLE_HOLD_TIME; } catch {}
    }

    // Hard-freeze on load and whenever browser tries to play while not speaking
    video.addEventListener("loadedmetadata", holdIdleFrame);
    video.addEventListener("canplay", holdIdleFrame);
    video.addEventListener("play", () => { if (!speaking) holdIdleFrame(); });

    video.addEventListener("timeupdate", () => {
      if (speaking && video.currentTime >= TALK_END) {
        video.currentTime = TALK_START + 0.01;
      }
    });

    function computeRMS(buf){
      let sum = 0;
      for (let i=0;i<buf.length;i++){
        const x = (buf[i] - 128) / 128;
        sum += x * x;
      }
      return Math.sqrt(sum / buf.length);
    }

    async function setSpeaking(on){
      if (on === speaking) return;
      speaking = on;

      if (speaking){
        video.loop = false;
        video.playbackRate = TALK_RATE;
        try { video.currentTime = TALK_START + 0.01; } catch {}
        try { await video.play(); } catch {}
      } else {
        holdIdleFrame();
      }
    }

    function stopAudioLoop(){
      if (raf) cancelAnimationFrame(raf);
      raf = null;
    }

    async function startAnalyserFromNode(audioCtx, sourceNode){
      stopAudioLoop();

      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      const data = new Uint8Array(analyser.fftSize);

      sourceNode.connect(analyser);

      console.log("[lip] analyser started");

      const loop = async () => {
        analyser.getByteTimeDomainData(data);

        const rms = computeRMS(data);
        const raw = Math.max(0, (rms - AUDIO_THRESHOLD) * AUDIO_GAIN);
        const level = Math.min(1, raw);

        last = last * SMOOTHING + level * (1 - SMOOTHING);

        // console.log("[lip]", "rms", rms.toFixed(4), "lvl", last.toFixed(3));

        if (!speaking && last >= SPEAK_ON) await setSpeaking(true);
        else if (speaking && last <= SPEAK_OFF) await setSpeaking(false);

        raf = requestAnimationFrame(loop);
      };
      loop();
    }

    async function tryBindFromAudioElement(){
      const audios = Array.from(document.querySelectorAll("audio"));
      const a =
        audios.find(x => x.srcObject instanceof MediaStream) ||
        audios.find(x => !x.paused) ||
        audios[0];

      if (!a) return false;

      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      await ctx.resume();

      const source = (a.srcObject instanceof MediaStream)
        ? ctx.createMediaStreamSource(a.srcObject)
        : ctx.createMediaElementSource(a);

      console.log("[lip] bound from <audio>");
      await startAnalyserFromNode(ctx, source);
      return true;
    }

    async function bindFromPeerStream(stream){
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      await ctx.resume();
      const source = ctx.createMediaStreamSource(stream);
      console.log("[lip] bound from WebRTC track");
      await startAnalyserFromNode(ctx, source);
    }

    async function bindFromAudioHook(ctx, src){
      try { await ctx.resume(); } catch {}
      console.log("[lip] bound from AudioContext hook");
      await startAnalyserFromNode(ctx, src);
    }

    // Arm everything on first user interaction (call click)
    let armed = false;
    window.addEventListener("pointerdown", async () => {
      if (armed) return;
      armed = true;

      holdIdleFrame();

      // Event-driven bindings
      if (window.__lipTap) window.__lipTap.onStream = (s) => bindFromPeerStream(s).catch(()=>{});
      if (window.__audioTap) window.__audioTap.onSource = (c, s) => bindFromAudioHook(c, s).catch(()=>{});

      // Quick poll to catch an audio element if it appears
      const t0 = performance.now();
      const poll = async () => {
        if (raf) return; // already running
        const ok = await tryBindFromAudioElement();
        if (ok) return;

        // If peer stream already exists, bind
        if (window.__lipTap?.stream) {
          bindFromPeerStream(window.__lipTap.stream).catch(()=>{});
          return;
        }

        // keep trying for a bit
        if (performance.now() - t0 < 15000) setTimeout(poll, 150);
      };
      poll();
    }, { capture: true });

    // Initial freeze
    holdIdleFrame();
  </script>
</body>
</html>

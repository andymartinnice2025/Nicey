<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voice Bot – MP4 Avatar (Animate Only On Bot Audio)</title>

  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    .stage{
      position: relative;
      width: min(720px, calc(100vw - 24px));
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }
    video{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>
  <div class="stage">
    <video
      id="avatarVideo"
      src="./SKO NiCY Animation Speech.mp4"
      muted
      playsinline
      preload="auto"
    ></video>
  </div>

  <!-- Cognigy WebRTC Widget -->
  <script src="https://static-trial.cognigy.ai/webrtc/webRTCWidget.js"></script>
  <script>
    addEventListener("load", () => {
      if (window.initWebRTCWidget) {
        window.initWebRTCWidget(
          "https://endpoint-trial-us.cognigy.ai/43947422bffcca503a42c2b9b03611a5f85c57045d9a05957c16111e450de980"
        );
      }
    });
  </script>

  <script>
    const video = document.getElementById("avatarVideo");

    /* ===================== CONFIG ===================== */

    // Hold still on this frame while silent (change if that frame has mouth movement)
    const IDLE_HOLD_TIME = 0.00;

    // Talk loop: full ~4s clip
    const TALK_START = 0.00;
    const TALK_END   = 3.98;
    const TALK_RATE  = 1.08;

    // Make it sensitive (you reported no movement)
    const AUDIO_THRESHOLD = 0.012;
    const AUDIO_GAIN = 16.0;
    const SMOOTHING = 0.08;
    const SPEAK_ON  = 0.035;
    const SPEAK_OFF = 0.020;

    /* ================================================== */

    let speaking = false;
    let last = 0;
    let raf = null;

    function holdIdleFrame() {
      video.pause();
      try { video.currentTime = IDLE_HOLD_TIME; } catch {}
    }

    // Freeze aggressively until speaking=true
    video.addEventListener("loadedmetadata", holdIdleFrame);
    video.addEventListener("canplay", holdIdleFrame);
    video.addEventListener("play", () => { if (!speaking) holdIdleFrame(); });

    // Loop talk segment only while speaking
    video.addEventListener("timeupdate", () => {
      if (speaking && video.currentTime >= TALK_END) {
        video.currentTime = TALK_START + 0.01;
      }
    });

    function computeRMS(buf){
      let sum = 0;
      for (let i=0;i<buf.length;i++){
        const x = (buf[i] - 128) / 128;
        sum += x * x;
      }
      return Math.sqrt(sum / buf.length);
    }

    async function setSpeaking(on){
      if (on === speaking) return;
      speaking = on;

      if (speaking){
        video.loop = false;
        video.playbackRate = TALK_RATE;
        try { video.currentTime = TALK_START + 0.01; } catch {}
        try { await video.play(); } catch {}
      } else {
        holdIdleFrame();
      }
    }

    function stopAudioLoop(){
      if (raf) cancelAnimationFrame(raf);
      raf = null;
    }

    /* ---------- Shadow DOM deep search for <audio> ---------- */

    function collectAudiosDeep(root, out, seen) {
      if (!root || seen.has(root)) return;
      seen.add(root);

      // If root is an Element, check if it's <audio>
      if (root.nodeType === 1) {
        const el = root;
        if (el.tagName === "AUDIO") out.push(el);

        // Explore shadow root if present
        if (el.shadowRoot) collectAudiosDeep(el.shadowRoot, out, seen);

        // Explore children
        for (const child of el.children) collectAudiosDeep(child, out, seen);
      } else if (root.nodeType === 11) {
        // DocumentFragment / ShadowRoot
        const frag = root;
        // Query audio inside this fragment
        const audios = frag.querySelectorAll ? frag.querySelectorAll("audio") : [];
        for (const a of audios) out.push(a);

        // Explore element children of the fragment
        if (frag.children) {
          for (const child of frag.children) collectAudiosDeep(child, out, seen);
        } else if (frag.childNodes) {
          for (const node of frag.childNodes) collectAudiosDeep(node, out, seen);
        }
      } else if (root.childNodes) {
        for (const node of root.childNodes) collectAudiosDeep(node, out, seen);
      }
    }

    function findAudioDeep() {
      const out = [];
      collectAudiosDeep(document.documentElement, out, new WeakSet());

      // De-dupe
      const unique = Array.from(new Set(out));

      // Prefer playing / stream-backed audio
      return (
        unique.find(a => a.srcObject instanceof MediaStream) ||
        unique.find(a => !a.paused && (a.currentSrc || a.src)) ||
        unique[0] ||
        null
      );
    }

    async function hookBotAudio(){
      stopAudioLoop();

      const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextCtor) return;

      const ctx = new AudioContextCtor();
      await ctx.resume();

      // Wait until the widget creates audio (even in Shadow DOM)
      const start = performance.now();
      let audioEl = null;

      while (performance.now() - start < 20000) {
        audioEl = findAudioDeep();
        if (audioEl) break;
        await new Promise(r => setTimeout(r, 100));
      }

      if (!audioEl) {
        console.log("[mp4-sync] No audio found (even via Shadow DOM). If widget runs in cross-origin iframe, audio is inaccessible.");
        return;
      }

      console.log("[mp4-sync] Found audio via deep search:", audioEl);

      const source = (audioEl.srcObject instanceof MediaStream)
        ? ctx.createMediaStreamSource(audioEl.srcObject)
        : ctx.createMediaElementSource(audioEl);

      const analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;
      const data = new Uint8Array(analyser.fftSize);

      source.connect(analyser);

      const loop = async () => {
        analyser.getByteTimeDomainData(data);

        const rms = computeRMS(data);
        const raw = Math.max(0, (rms - AUDIO_THRESHOLD) * AUDIO_GAIN);
        const level = Math.min(1, raw);

        last = last * SMOOTHING + level * (1 - SMOOTHING);

        if (!speaking && last >= SPEAK_ON) await setSpeaking(true);
        else if (speaking && last <= SPEAK_OFF) await setSpeaking(false);

        raf = requestAnimationFrame(loop);
      };
      loop();
    }

    // Arm on first user interaction (clicking the call button counts)
    let armed = false;
    window.addEventListener("pointerdown", () => {
      if (armed) return;
      armed = true;

      holdIdleFrame();
      hookBotAudio().catch(()=>{});
    }, { capture: true });

    // Initial freeze
    holdIdleFrame();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voice Bot Avatar</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
    }

    .stage{
      position: relative;
      width: min(560px, calc(100vw - 24px));
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }

    img.avatar{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .mouth-wrap{
      position:absolute;
      pointer-events:none;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .mouth-svg{
      width:100%;
      height:100%;
      display:block;
      transform-origin: 50% 50%;
      will-change: transform;
    }
  </style>
</head>

<body>
  <div class="stage">
    <img class="avatar" id="avatarImage" src="./nicey-mouthless.png" alt="Avatar" />

    <div class="mouth-wrap" id="mouthWrap">
      <svg class="mouth-svg" id="mouthSvg" viewBox="0 0 320 180" aria-hidden="true">
        <defs>
          <filter id="ds" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.30)"/>
          </filter>

          <clipPath id="ribbonClip">
            <path
              d="
                M 70 115
                C 125 155, 215 155, 265 115
                L 265 85
                C 215 125, 125 125, 70 85
                Z
              " />
          </clipPath>
        </defs>

        <g clip-path="url(#ribbonClip)">
          <path id="mouthCavity"
            d="
              M 82 112
              C 130 150, 205 150, 253 112
              C 230 150, 160 162, 105 140
              C 90 132, 80 122, 82 112
              Z
            "
            fill="rgba(20,6,10,0.65)"
            opacity="0"
            filter="url(#ds)"
          />
        </g>

        <path id="ribbonEdge"
          d="
            M 70 115
            C 125 155, 215 155, 265 115
            L 265 85
            C 215 125, 125 125, 70 85
            Z
          "
          fill="rgba(0,0,0,0.18)"
          transform="translate(1,2)"
          filter="url(#ds)"
        />

        <path
          d="
            M 70 115
            C 125 155, 215 155, 265 115
            L 265 85
            C 215 125, 125 125, 70 85
            Z
          "
          fill="#fff"
          filter="url(#ds)"
          opacity="0.99"
        />
      </svg>
    </div>
  </div>

  <!-- =========================================================
       HOOKS (must be before widget loads)
       ========================================================= -->

  <!-- RTCPeerConnection hook: start immediately on first audio track -->
  <script>
    (function () {
      window.__lipTap = {
        stream: null,
        pcSeen: 0,
        onStream: null, // callback when stream appears
      };

      const OrigPC = window.RTCPeerConnection;
      if (!OrigPC) return;

      function WrappedPC(...args) {
        const pc = new OrigPC(...args);
        window.__lipTap.pcSeen++;

        pc.addEventListener("track", (ev) => {
          const track = ev.track;
          if (track && track.kind === "audio") {
            const stream = (ev.streams && ev.streams[0]) ? ev.streams[0] : new MediaStream([track]);
            window.__lipTap.stream = stream;
            if (typeof window.__lipTap.onStream === "function") {
              window.__lipTap.onStream(stream);
            }
          }
        });

        return pc;
      }
      WrappedPC.prototype = OrigPC.prototype;
      window.RTCPeerConnection = WrappedPC;
    })();
  </script>

  <!-- AudioContext hook (if widget uses WebAudio in parent page) -->
  <script>
    (function () {
      const OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
      if (!OriginalAudioContext) return;

      window.__audioTap = { ctx: null, source: null, onSource: null };

      function WrappedAudioContext(...args) {
        const ctx = new OriginalAudioContext(...args);
        window.__audioTap.ctx = ctx;

        if (ctx.createMediaStreamSource) {
          const orig = ctx.createMediaStreamSource.bind(ctx);
          ctx.createMediaStreamSource = function (stream) {
            const src = orig(stream);
            window.__audioTap.source = src;
            if (typeof window.__audioTap.onSource === "function") window.__audioTap.onSource(ctx, src);
            return src;
          };
        }

        if (ctx.createMediaElementSource) {
          const origEl = ctx.createMediaElementSource.bind(ctx);
          ctx.createMediaElementSource = function (el) {
            const src = origEl(el);
            window.__audioTap.source = src;
            if (typeof window.__audioTap.onSource === "function") window.__audioTap.onSource(ctx, src);
            return src;
          };
        }

        return ctx;
      }
      WrappedAudioContext.prototype = OriginalAudioContext.prototype;
      window.AudioContext = WrappedAudioContext;
      if (window.webkitAudioContext) window.webkitAudioContext = WrappedAudioContext;
    })();
  </script>

  <!-- Cognigy WebRTC Widget -->
  <script src="https://static-trial.cognigy.ai/webrtc/webRTCWidget.js"></script>
  <script>
    addEventListener("load", () => {
      if (window.initWebRTCWidget) {
        window.initWebRTCWidget(
          "https://endpoint-trial-us.cognigy.ai/43947422bffcca503a42c2b9b03611a5f85c57045d9a05957c16111e450de980"
        );
      }
    });
  </script>

  <script>
    const byId = (id) => document.getElementById(id);

    const mouthWrapEl = byId("mouthWrap");
    const mouthSvgEl  = byId("mouthSvg");
    const cavityEl    = byId("mouthCavity");
    const ribbonEdge  = byId("ribbonEdge");

    // Placement + tuning
    const LOCK = {
      mx: 57.7,
      my: 36.5,
      mw: 235,
      mh: 155,
      ang: -28,

      closedY: 0.92,
      openAddY: 0.25,

      closedX: 1.00,
      widenAddX: 0.10,

      // faster response (lower = snappier)
      smoothing: 0.12,

      // audio mapping
      th: 0.018,
      gain: 12.0
    };

    function applyPlacement(){
      mouthWrapEl.style.left = LOCK.mx + "%";
      mouthWrapEl.style.top  = LOCK.my + "%";
      mouthWrapEl.style.width  = LOCK.mw + "px";
      mouthWrapEl.style.height = LOCK.mh + "px";
      mouthWrapEl.style.transform = `translate(-50%,-50%) rotate(${LOCK.ang}deg)`;
      render(0);
    }
    applyPlacement();
    window.addEventListener("resize", applyPlacement);

    function render(open01){
      const sx = LOCK.closedX + open01 * LOCK.widenAddX;
      const sy = LOCK.closedY + open01 * LOCK.openAddY;
      mouthSvgEl.style.transform = `scale(${sx}, ${sy})`;

      cavityEl.style.opacity = Math.max(0, Math.min(1, open01 * 0.95)).toFixed(3);
      ribbonEdge.style.opacity = (0.20 + (1-open01)*0.08).toFixed(3);
    }

    function computeRMS(buf){
      let sum = 0;
      for (let i=0;i<buf.length;i++){
        const v = (buf[i]-128)/128;
        sum += v*v;
      }
      return Math.sqrt(sum / buf.length);
    }

    let raf = null;
    function stopLipSync(){
      if (raf) cancelAnimationFrame(raf);
      raf = null;
      render(0);
    }

    async function startFromSourceNode(audioCtx, sourceNode){
      stopLipSync();

      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024; // slightly smaller = faster response
      const data = new Uint8Array(analyser.fftSize);

      sourceNode.connect(analyser);

      let last = 0;
      const loop = () => {
        analyser.getByteTimeDomainData(data);
        const rms = computeRMS(data);

        const raw = Math.max(0, (rms - LOCK.th) * LOCK.gain);
        const open = Math.min(1, raw);

        last = last * LOCK.smoothing + open * (1 - LOCK.smoothing);
        render(last);

        raf = requestAnimationFrame(loop);
      };
      loop();
    }

    // --- Event-driven audio discovery (no waiting) ---

    function tryImmediateAudioElementBind(){
      const audios = Array.from(document.querySelectorAll("audio"));
      const a = audios.find(x => x.srcObject instanceof MediaStream) || audios.find(x => !x.paused) || audios[0];
      if (!a) return false;

      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      ctx.resume().catch(()=>{});

      const sourceNode = a.srcObject instanceof MediaStream
        ? ctx.createMediaStreamSource(a.srcObject)
        : ctx.createMediaElementSource(a);

      startFromSourceNode(ctx, sourceNode);
      return true;
    }

    function setupAudioElementObserver(){
      const obs = new MutationObserver(() => {
        // bind the moment an audio element appears
        if (tryImmediateAudioElementBind()) {
          obs.disconnect();
        }
      });
      obs.observe(document.documentElement, { childList: true, subtree: true });
    }

    // --- Auto-start arming ---
    // Clicking the widget to start the call counts as a user gesture.
    let armed = false;
    let started = false;

    async function startLipSyncFast(){
      if (!armed || started) return;
      started = true;

      // 1) If audio element already exists, bind immediately
      if (tryImmediateAudioElementBind()) return;

      // 2) Listen for <audio> being injected
      setupAudioElementObserver();

      // 3) Listen for WebRTC track event (instant when it happens)
      window.__lipTap.onStream = async (stream) => {
        try{
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          await ctx.resume();
          const sourceNode = ctx.createMediaStreamSource(stream);
          startFromSourceNode(ctx, sourceNode);
        } catch {}
      };

      // 4) Listen for WebAudio source hook (instant if used)
      if (window.__audioTap) {
        window.__audioTap.onSource = async (ctx, src) => {
          try { await ctx.resume(); } catch {}
          startFromSourceNode(ctx, src);
        };
      }

      // 5) As a safety net, do a very fast short poll for the first 2s (covers odd init timing)
      const t0 = performance.now();
      const quickPoll = () => {
        if (raf) return; // already running
        if (tryImmediateAudioElementBind()) return;
        if (window.__lipTap?.stream) {
          window.__lipTap.onStream && window.__lipTap.onStream(window.__lipTap.stream);
          return;
        }
        if (performance.now() - t0 < 2000) {
          setTimeout(quickPoll, 50);
        } else {
          // then back off
          setTimeout(quickPoll, 500);
        }
      };
      quickPoll();
    }

    // Arm on first user interaction anywhere (including the widget call button)
    window.addEventListener("pointerdown", () => {
      armed = true;
      startLipSyncFast();
    }, { capture: true });

    // If the user starts the call via keyboard, also arm
    window.addEventListener("keydown", () => {
      armed = true;
      startLipSyncFast();
    }, { capture: true });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voice Bot – MP4 Avatar</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
    }

    .stage{
      position: relative;
      width: min(720px, calc(100vw - 24px));
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }

    video{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>
  <div class="stage">
    <video
      id="avatarVideo"
      src="./SKO NiCY Animation Speech.mp4"
      muted
      playsinline
      preload="auto"
    ></video>
  </div>

  <!-- Cognigy WebRTC Widget -->
  <script src="https://static-trial.cognigy.ai/webrtc/webRTCWidget.js"></script>
  <script>
    addEventListener("load", () => {
      if (window.initWebRTCWidget) {
        window.initWebRTCWidget(
          "https://endpoint-trial-us.cognigy.ai/43947422bffcca503a42c2b9b03611a5f85c57045d9a05957c16111e450de980"
        );
      }
    });
  </script>

  <script>
    const video = document.getElementById("avatarVideo");

    /* =========================================================
       CONFIG
       ========================================================= */

    // Full-video talk loop
    const TALK_START = 0.00;
    const TALK_END   = 3.98;

    const IDLE_RATE  = 1.00;
    const TALK_RATE  = 1.08;

    const AUDIO_THRESHOLD = 0.018;
    const AUDIO_GAIN = 12.0;
    const SMOOTHING = 0.10;

    const SPEAK_ON  = 0.06;
    const SPEAK_OFF = 0.04;

    /* ========================================================= */

    let audioCtx, analyser, data;
    let speaking = false;
    let last = 0;
    let started = false; // 🔑 prevents auto-start on load

    // Ensure video is paused on load
    video.pause();
    video.currentTime = 0;

    function computeRMS(buf){
      let sum = 0;
      for (let i = 0; i < buf.length; i++){
        const x = (buf[i] - 128) / 128;
        sum += x * x;
      }
      return Math.sqrt(sum / buf.length);
    }

    function setSpeaking(on){
      if (on === speaking) return;
      speaking = on;

      if (speaking){
        video.loop = false;
        video.playbackRate = TALK_RATE;
        video.currentTime = TALK_START + 0.01;
      } else {
        video.playbackRate = IDLE_RATE;
        video.loop = true;
      }
    }

    video.addEventListener("timeupdate", () => {
      if (speaking && video.currentTime >= TALK_END){
        video.currentTime = TALK_START + 0.01;
      }
    });

    async function hookBotAudio(){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();

      const findAudio = async () => {
        const start = performance.now();
        while (performance.now() - start < 15000){
          const audios = Array.from(document.querySelectorAll("audio"));
          const a =
            audios.find(x => x.srcObject instanceof MediaStream) ||
            audios.find(x => !x.paused) ||
            audios[0];
          if (a) return a;
          await new Promise(r => setTimeout(r, 100));
        }
        return null;
      };

      const audioEl = await findAudio();
      if (!audioEl) return;

      const source = (audioEl.srcObject instanceof MediaStream)
        ? audioCtx.createMediaStreamSource(audioEl.srcObject)
        : audioCtx.createMediaElementSource(audioEl);

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      data = new Uint8Array(analyser.fftSize);

      source.connect(analyser);

      const loop = () => {
        analyser.getByteTimeDomainData(data);

        const rms = computeRMS(data);
        const raw = Math.max(0, (rms - AUDIO_THRESHOLD) * AUDIO_GAIN);
        const level = Math.min(1, raw);

        last = last * SMOOTHING + level * (1 - SMOOTHING);

        if (!speaking && last >= SPEAK_ON) setSpeaking(true);
        else if (speaking && last <= SPEAK_OFF) setSpeaking(false);

        requestAnimationFrame(loop);
      };
      loop();
    }

    // 🔑 Start EVERYTHING on first user interaction (call click)
    window.addEventListener("pointerdown", async () => {
      if (started) return;
      started = true;

      // Start video
      try {
        await video.play();
      } catch {}

      // Hook audio
      hookBotAudio().catch(()=>{});
    }, { capture: true });
  </script>
</body>
</html>

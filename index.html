<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voice Bot – MP4 Avatar (Animate Only On Bot Audio)</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
    }

    .stage{
      position: relative;
      width: min(720px, calc(100vw - 24px));
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }

    video{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>
  <div class="stage">
    <video
      id="avatarVideo"
      src="./SKO NiCY Animation Speech.mp4"
      muted
      playsinline
      preload="auto"
    ></video>
  </div>

  <!-- Cognigy WebRTC Widget -->
  <script src="https://static-trial.cognigy.ai/webrtc/webRTCWidget.js"></script>
  <script>
    addEventListener("load", () => {
      if (window.initWebRTCWidget) {
        window.initWebRTCWidget(
          "https://endpoint-trial-us.cognigy.ai/43947422bffcca503a42c2b9b03611a5f85c57045d9a05957c16111e450de980"
        );
      }
    });
  </script>

  <script>
    const video = document.getElementById("avatarVideo");

    /* =========================================================
       CONFIG
       ========================================================= */

    // Hold the avatar perfectly still on this frame while silent
    const IDLE_HOLD_TIME = 0.00; // try 0.15 / 0.25 if frame 0 isn't neutral

    // Talk loop (full 4s loop; avoid exact end)
    const TALK_START = 0.00;
    const TALK_END   = 3.98;

    // Playback speed while talking
    const TALK_RATE  = 1.08;

    // Audio->level mapping
    const AUDIO_THRESHOLD = 0.018;
    const AUDIO_GAIN = 12.0;
    const SMOOTHING = 0.10;

    // Hysteresis (prevents flicker)
    const SPEAK_ON  = 0.06;
    const SPEAK_OFF = 0.04;

    /* ========================================================= */

    let audioCtx, analyser, data;
    let last = 0;
    let armed = false;
    let speaking = false;
    let haveEverSpoken = false;

    // --- Ensure the video NEVER plays on load (even if browser tries) ---
    function holdIdleFrame() {
      video.pause();
      // Setting currentTime is safe after metadata is available; if not, it will apply later
      try { video.currentTime = IDLE_HOLD_TIME; } catch {}
    }

    // On any event that might cause playback, force pause until bot audio says "speak"
    video.addEventListener("play", () => {
      if (!speaking) holdIdleFrame();
    });

    video.addEventListener("loadedmetadata", () => {
      holdIdleFrame();
    });

    video.addEventListener("canplay", () => {
      holdIdleFrame();
    });

    // Keep looping talk segment while speaking
    video.addEventListener("timeupdate", () => {
      if (speaking && video.currentTime >= TALK_END) {
        video.currentTime = TALK_START + 0.01;
      }
    });

    function computeRMS(buf){
      let sum = 0;
      for (let i = 0; i < buf.length; i++){
        const x = (buf[i] - 128) / 128;
        sum += x * x;
      }
      return Math.sqrt(sum / buf.length);
    }

    async function setSpeaking(on){
      if (on === speaking) return;
      speaking = on;

      if (speaking) {
        haveEverSpoken = true;

        // Start / continue talk animation
        video.loop = false;
        video.playbackRate = TALK_RATE;

        // Jump into talk loop immediately
        try { video.currentTime = TALK_START + 0.01; } catch {}

        // Play (must succeed because we are armed via user gesture + muted video)
        try { await video.play(); } catch {}

      } else {
        // Stop animation completely when silent
        holdIdleFrame();
      }
    }

    async function hookBotAudio(){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();

      // Find widget audio
      const findAudio = async () => {
        const start = performance.now();
        while (performance.now() - start < 15000){
          const audios = Array.from(document.querySelectorAll("audio"));
          const a =
            audios.find(x => x.srcObject instanceof MediaStream) ||
            audios.find(x => !x.paused) ||
            audios[0];
          if (a) return a;
          await new Promise(r => setTimeout(r, 100));
        }
        return null;
      };

      const audioEl = await findAudio();
      if (!audioEl) return;

      const source = (audioEl.srcObject instanceof MediaStream)
        ? audioCtx.createMediaStreamSource(audioEl.srcObject)
        : audioCtx.createMediaElementSource(audioEl);

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      data = new Uint8Array(analyser.fftSize);

      source.connect(analyser);

      const loop = async () => {
        analyser.getByteTimeDomainData(data);

        const rms = computeRMS(data);
        const raw = Math.max(0, (rms - AUDIO_THRESHOLD) * AUDIO_GAIN);
        const level = Math.min(1, raw);

        last = last * SMOOTHING + level * (1 - SMOOTHING);

        if (!speaking && last >= SPEAK_ON) await setSpeaking(true);
        else if (speaking && last <= SPEAK_OFF) await setSpeaking(false);

        requestAnimationFrame(loop);
      };
      loop();
    }

    // Arm only on first user interaction (clicking the WebRTC call button counts)
    window.addEventListener("pointerdown", () => {
      if (armed) return;
      armed = true;

      // Keep it still immediately after arming until bot audio truly starts
      holdIdleFrame();

      hookBotAudio().catch(() => {});
    }, { capture: true });

    // As a fallback: keep holding the idle frame if user never interacts
    holdIdleFrame();
  </script>
</body>
</html>
